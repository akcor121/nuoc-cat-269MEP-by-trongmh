const DATA=[{"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Hồ sơ mời thầu yêu cầu máy phát điện có công suất chính tối thiểu 1.000 kV Nhà thầu chào máy phát điện có công suất dự phòng 1.000 kV Căn cứ thông số chào thầu nêu trên, việc đánh giá đáp ứng về kỹ thuật của nội dung này được xác định như thế nào?", "options": ["Không đáp ứng, vì với cùng một tổ máy, công suất dự phòng lớn hơn công suất chính, nên công suất chính của máy chào thầu thấp hơn 1.000 kVA", "Đáp ứng, vì công suất dự phòng lớn hơn công suất chính nên máy chào thầu có dư công suất", "Đáp ứng nếu nhà thầu cam kết thời gian bảo hành dài hơn yêu cầu của hồ sơ mời thầu", "Đáp ứng, vì công suất ghi trên máy bằng với yêu cầu của hồ sơ mời thầu"], "correct": 0, "source": "Bộ đề 163"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026) và Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), chủ đầu tư chia nhỏ dự án thành nhiều gói thầu để giá của mỗi gói thầu nằm trong hạn mức áp dụng chỉ định thầu nhằm mục đích chỉ định thầu thì hành vi này được xử lý như thế nào?", "options": ["Là hành vi thông thầu; tổ chức, cá nhân vi phạm có thể bị cấm tham gia hoạt động đấu thầu từ 03 năm đến 05 năm", "Chỉ bị coi là vi phạm khi tổng giá trị các gói thầu được chia nhỏ vượt quá 05 tỷ đồng", "Được phép nếu việc phân chia đã được thể hiện trong kế hoạch lựa chọn nhà thầu được người có thẩm quyền phê duyệt", "Là hành vi bị cấm thuộc nhóm \"không bảo đảm công bằng, minh bạch\"; tổ chức, cá nhân vi phạm có thể bị cấm tham gia hoạt động đấu thầu từ 01 năm đến 03 năm"], "correct": 3, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026) và Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), gói thầu nào sau đây không được áp dụng hình thức chào hàng cạnh tranh?", "options": ["Gói thầu dịch vụ tư vấn đơn giản, có giá gói thầu 02 tỷ đồng", "Gói thầu xây l rce": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), việc nêu yêu cầu cụ thể về nhãn hiệu, xuất xứ hàng hóa trong hồ sơ mời thầu của gói thầu mua sắm hàng hóa áp dụng hình thức chào hàng cạnh tranh (không thuộc các trường hợp ngoại lệ được Luật cho phép) được xác định như thế nào?", "options": ["Được phép nếu chủ đầu tư có văn bản giải trình gửi người có thẩm quyền trước khi phát hành hồ sơ mời thầu", "Được phép, vì chào hàng cạnh tranh là hình thức lựa chọn nhà thầu có quy trình rút gọn", "Được phép nếu giá gói thầu không quá 10 tỷ đồng", "Là hành vi bị cấm thuộc nhóm hành vi không bảo đảm công bằng, minh bạch trong đấu thầu"], "correct": 3, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), việc nêu yêu cầu cụ thể về nhãn hiệu, xuất xứ hàng hóa trong hồ sơ mời thầu đối với gói thầu mua sắm hàng hóa áp dụng hình thức đấu thầu rộng rãi (không thuộc các trường hợp ngoại lệ được Luật cho phép) là vi phạm thuộc nhóm hành vi bị cấm nào?", "options": ["Gian lận", "Cản trở hoạt động đấu thầu", "Thông thầu", "Không bảo đảm công bằng, minh bạch"], "correct": 3, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), việc nêu yêu cầu cụ thể về nhãn hiệu, xuất xứ hàng hóa trong hồ sơ yêu cầu của gói thầu mua sắm hàng hóa áp dụng hình thức chỉ định thầu có thuộc hành vi bị cấm trong đấu thầu hay không?", "options": ["Có, thuộc hành vi không bảo đảm công bằng, minh bạch trong đấu thầu", "Có, thuộc hành vi thông thầu", "Không, nếu được người có thẩm quyền chấp thuận bằng văn bản trước khi phát hành hồ sơ yêu cầu", "Không, vì quy định cấm nêu nhãn hiệu, xuất xứ hàng hóa chỉ áp dụng đối với hồ sơ mời thầu khi áp dụng hình thức đấu thầu rộng rãi, đấu thầu hạn chế, chào hàng cạnh tranh"], "correct": 3, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với gói thầu dịch vụ tư vấn áp dụng phương pháp kết hợp giữa kỹ thuật và giá, khi xây dựng điểm tổng hợp phải bảo đảm nguyên tắc tỷ trọng điểm như thế nào?", "options": ["Điểm về kỹ thuật và điểm về giá mỗi loại chiếm 50% tổng số điểm của thang điểm tổng hợp", "Điểm về kỹ thuật từ 50% đến 60%, điểm về giá từ 40% đến 50% tổng số điểm của thang điểm tổng hợp", "Điểm về kỹ thuật từ 70% đến 80%, điểm về giá từ 20% đến 30% tổng số điểm của thang điểm tổng hợp", "Điểm về kỹ thuật từ 80% đến 90%, điểm về giá từ 10% đến 20% tổng số điểm của thang điểm tổng hợp"], "correct": 2, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với gói thầu không áp dụng thủ tục lựa chọn danh sách ngắn, thời gian bắt đầu tổ chức lựa chọn nhà thầu trong kế hoạch lựa chọn nhà thầu được tính từ khi nào?", "options": ["Từ thời điểm đóng thầu", "Từ khi phát hành hồ sơ mời thầu, hồ sơ yêu cầu", "Từ khi kế hoạch lựa chọn nhà thầu được phê duyệt", "Từ khi hồ sơ mời thầu, hồ sơ yêu cầu được phê duyệt"], "correct": 1, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với gói thầu xây lắp, hỗn hợp có giá gói thầu không quá 20 tỷ đồng, gói thầu mua sắm hàng hóa, dịch vụ phi tư vấn có giá gói thầu không quá 10 tỷ đồng thì mức bảo đảm dự thầu được quy định như thế nào trong HSMT?", "options": ["Từ 1% đến 3% giá gói thầu", "Từ 1% đến 1,5% giá gói thầu", "Từ 1,5% đến 3% giá gói thầu", "Từ 0,5% đến 1,5% giá gói thầu"], "correct": 1, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với gói thầu xây lắp, trường hợp nhà thầu chào giá dự thầu thấp bất thường so với giá gói thầu thì chủ đầu tư xử lý như thế nào?", "options": ["Loại bỏ ngay hồ sơ dự thầu của nhà thầu", "Chấp nhận giá dự thầu của nhà thầu mà không cần làm rõ, vì giá thấp mang lại hiệu quả kinh tế", "Yêu cầu nhà thầu giải trình, làm rõ tính khả thi, hợp lý của giá dự thầu đã chào để làm cơ sở đánh giá đáp ứng hoặc loại bỏ hồ sơ dự thầu", "Yêu cầu nhà thầu điều chỉnh tăng giá dự thầu cho phù hợp với giá gói thầu"], "correct": 2, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với gói thầu áp dụng hình thức chỉ định thầu theo quy trình thông thường, phương thức lựa chọn nhà thầu trong kế hoạch lựa chọn nhà thầu được ghi như thế nào?", "options": ["Một giai đoạn hai túi hồ sơ", "Hai giai đoạn một túi hồ sơ", "Một giai đoạn một túi hồ sơ", "Hai giai đoạn hai túi hồ sơ"], "correct": 2, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với gói thầu áp dụng phương pháp kết hợp giữa kỹ thuật và giá, nhà thầu nào được xếp hạng thứ nhất?", "options": ["Nhà thầu có điểm kỹ thuật cao nhất", "Nhà thầu có giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có) thấp nhất", "Nhà thầu có giá đánh giá thấp nhất", "Nhà thầu có điểm tổng hợp cao nhất"], "correct": 3, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với gói thầu áp dụng tùy chọn mua thêm, điều kiện về khối lượng mua thêm được quy định như thế nào?", "options": ["Giá trị mua thêm không vượt 30% giá hợp đồng", "Khối lượng mua thêm không vượt 30% của khối lượng hạng mục tương ứng nêu trong hợp đồng", "Khối lượng mua thêm không vượt 10% của khối lượng hạng mục tương ứng nêu trong hợp đồng", "Khối lượng mua thêm không vượt 20% của khối lượng hạng mục tương ứng nêu trong hợp đồng"], "correct": 1, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với hợp đồng theo đơn giá cố định, nhận định nào sau đây là đúng?", "options": ["Giá hợp đồng ban đầu dựa trên số lượng, khối lượng công việc và đơn giá cố định, không bao gồm chi phí dự phòng; nhà thầu được thanh toán theo khối lượng ghi trong hợp đồng, không phụ thuộc khối lượng nghiệm thu thực tế.", "Giá hợp đồng ban đầu dựa trên số lượng, khối lượng công việc, đơn giá cố định và chi phí dự phòng cho số lượng, khối lượng công việc có thể phát sinh; nhà thầu được thanh toán theo số lượng, khối lượng công việc được nghiệm thu và đơn giá cố định quy định tại hợp đồng", "Đơn giá trong hợp đồng được điều chỉnh khi giá vật liệu, nhân công trên thị trường biến động; nhà thầu được thanh toán theo khối lượng được nghiệm thu và đơn giá đã điều chỉnh", "Giá hợp đồng không thay đổi trong suốt thời gian thực hiện; nhà thầu được thanh toán theo tỷ lệ phần trăm giá hợp đồng tương ứng với từng giai đoạn thanh toán"], "correct": 1, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với hợp đồng theo đơn giá điều chỉnh, nhận định nào sau đây là đúng?", "options": ["Giá hợp đồng ban đầu dựa trên số lượng, khối lượng công việc cần thiết với đơn giá cơ sở theo hợp đồng và chi phí dự phòng cho số lượng, khối lượng có thể phát sinh, chi phí dự phòng trượt giá; hợp đồng phải quy định phương pháp tính trượt giá và chi phí dự phòng trượt giá", "Đơn giá được điều chỉnh căn cứ vào biến động giá thị trường tại thời điểm thanh toán; nhà thầu được thanh toán theo khối lượng ghi trong hợp đồng và đơn giá đã điều chỉnh", "Chỉ được điều chỉnh đơn giá đối với một số nội dung công việc có biến động giá lớn; nhà thầu được thanh toán theo tỷ lệ phần trăm giá hợp đồng tương ứng với từng giai đoạn thanh toán", "Giá hợp đồng ban đầu dựa trên số lượng, khối lượng công việc và đơn giá cơ sở, không bao gồm chi phí dự phòng trượt giá; việc điều chỉnh đơn giá do các bên thỏa thuận khi phát sinh biến động giá, không bắt buộc quy định phương pháp tính trong hợp đồng"], "correct": 0, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với hợp đồng trọn gói, giá hợp đồng được phép thay đổi trong trường hợp nào sau đây?", "options": ["Trường hợp bất khả kháng và thay đổi phạm vi công việc phải thực hiện dẫn đến giá hợp đồng thay đổi", "Giá vật liệu trên thị trường biến động vượt mức chi phí dự phòng đã tính trong giá hợp đồng", "Khối lượng thực tế thi công vượt khối lượng ghi trong hợp đồng", "Chủ đầu tư và nhà thầu thống nhất điều chỉnh đơn giá một số hạng mục trong quá trình thực hiện"], "correct": 0, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với nhà thầu không được lựa chọn, chủ đầu tư, bên mời thầu có trách nhiệm hoàn trả hoặc giải tỏa bảo đảm dự thầu trong thời hạn nào sau đây?", "options": ["Không quá 14 ngày kể từ ngày hợp đồng với nhà thầu được lựa chọn có hiệu lực", "Theo thời hạn quy định trong hồ sơ mời thầu nhưng không quá 14 ngày kể từ ngày kết quả lựa chọn nhà thầu được phê duyệt", "Không quá 10 ngày làm việc kể từ ngày đóng thầu", "Không quá 30 ngày kể từ ngày kết quả lựa chọn nhà thầu được phê duyệt"], "correct": 1, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với nhà thầu được lựa chọn thuộc trường hợp phải bảo đảm thực hiện hợp đồng, nhà thầu phải thực hiện biện pháp bảo đảm thực hiện hợp đồng vào thời điểm nào?", "options": ["Trong thời hạn 14 ngày kể từ ngày hợp đồng có hiệu lực", "Sau khi nghiệm thu hoàn thành hạng mục công việc đầu tiên của hợp đồng", "Trước thời điểm đóng thầu, cùng với hồ sơ dự thầu", "Trước hoặc cùng thời điểm hợp đồng có hiệu lực"], "correct": 3, "source": "VB hợp nhất 74/VBHN"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Nghị định 207/2026/NĐ-CP, trách nhiệm của nhà thầu phụ về chất lượng và an toàn trong thi công xây dựng công trình đối với các công việc do mình thực hiện được quy định như thế nào?", "options": ["Chỉ chịu trách nhiệm trước chủ đầu tư", "Không chịu trách nhiệm, vì nhà thầu chính chịu toàn bộ trách nhiệm trước chủ đầu tư về công việc do nhà thầu phụ thực hiện", "Chỉ chịu trách nhiệm trước nhà thầu chính", "Chịu trách nhiệm trực tiếp, toàn diện trước pháp luật, trước chủ đầu tư và trước nhà thầu chính"], "correct": 3, "source": "NĐ 207/2026"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, trường hợp nhà thầu chính sử dụng nhà thầu phụ không có trong danh sách thầu phụ kèm theo hợp đồng thì phải được ai chấp thuận?", "options": ["Không cần chấp thuận, nhà thầu chính tự quyết định và chịu trách nhiệm", "Cơ quan chuyên môn về xây dựng chấp thuận bằng văn bản", "Người quyết định đầu tư chấp thuận bằng văn bản", "Chủ đầu tư chấp thuận bằng văn bản"], "correct": 3, "source": "NĐ 210/2026"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), nhà thầu liên danh gồm thành viên A và thành viên B, trong đó thành viên B có hành vi gian lận (làm giả tài liệu trong hồ sơ dự thầu). Việc cấm tham gia hoạt động đấu thầu được áp dụng như thế nào?", "options": ["Cấm tham gia hoạt động đấu thầu đối với thành viên đứng đầu liên danh", "Chỉ cấm tham gia hoạt động đấu thầu đối với thành viên B, không cấm đối với thành viên A", "Cấm tham gia hoạt động đấu thầu đối với tất cả thành viên trong liên danh", "Không áp dụng hình thức cấm, chỉ loại hồ sơ dự thầu của liên danh"], "correct": 1, "source": "NĐ 214/2025"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), trường hợp có nhiều nhà thầu được đánh giá tốt nhất, ngang nhau và không có nhà thầu nào là doanh nghiệp nhỏ và vừa do phụ nữ làm chủ thì trao thầu cho nhà thầu nào?", "options": ["Nhà thầu có số năm kinh nghiệm nhiều hơn", "Nhà thầu nộp hồ sơ dự thầu sớm hơn", "Lựa chọn nhà thầu có điểm kỹ thuật cao hơn hoặc có số tiêu chí đánh giá về kỹ thuật ở mức chấp nhận được ít hơn với trường hợp gói thầu áp dụng phương pháp giá thấp nhất; Lựa chọn nhà thầu có giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có) thấp hơn với gói thầu áp dụng phương pháp giá đánh giá hoặc phương pháp kết hợp giữa kỹ thuật và giá", "Chủ đầu tư quyết định lựa chọn một trong các nhà thầu"], "correct": 2, "source": "NĐ 214/2025"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), trường hợp có nhiều nhà thầu được đánh giá tốt nhất, ngang nhau, sau khi đã xét hết các tiêu chí ưu tiên về doanh nghiệp, kỹ thuật hoặc giá, trụ sở và lao động mà vẫn chưa lựa chọn được nhà thầu trúng thầu thì bước xử lý tiếp theo là gì?", "options": ["Tổ chức bốc thăm để lựa chọn nhà thầu trúng thầu", "Cho phép các nhà thầu chào lại giá dự thầu, không được chào cao hơn giá đã chào sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có)", "Hủy thầu và tổ chức lựa chọn nhà thầu lại", "Chủ đầu tư quyết định lựa chọn một trong các nhà thầu"], "correct": 1, "source": "NĐ 214/2025"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), trường hợp giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có) của tất cả các nhà thầu đáp ứng yêu cầu về kỹ thuật và thuộc danh sách xếp hạng đều vượt giá gói thầu đã duyệt (trường hợp có từ 02 nhà thầu trở lên vượt qua bước đánh giá về kỹ thuật), cách xử lý \"mời nhà thầu xếp hạng thứ nhất vào đàm phán về giá\" chỉ được áp dụng đối với gói thầu nào?", "options": ["Gói thầu áp dụng mọi hình thức lựa chọn nhà thầu", "Gói thầu áp dụng hình thức chào hàng cạnh tranh", "Gói thầu áp dụng hình thức đấu thầu hạn chế", "Gói thầu áp dụng hình thức đấu thầu rộng rãi"], "correct": 3, "source": "NĐ 214/2025"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), trường hợp giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có) của tất cả các nhà thầu đáp ứng yêu cầu về kỹ thuật và thuộc danh sách xếp hạng đều vượt giá gói thầu đã duyệt thì chủ đầu tư được xem xét xử lý theo cách nào sau đây?", "options": ["Cho phép các nhà thầu này được chào lại giá dự thầu nếu giá gói thầu đã bao gồm đầy đủ các yếu tố cấu thành chi phí thực hiện gói thầu", "Phê duyệt kết quả lựa chọn nhà thầu, sau đó điều chỉnh tăng giá gói thầu bằng giá đề nghị trúng thầu", "Chấp thuận trúng thầu cho nhà thầu xếp hạng thứ nhất nếu phần giá vượt không quá 10% giá gói thầu", "Cho phép nhà thầu xếp hạng thứ nhất điều chỉnh giảm phạm vi, khối lượng công việc để giá dự thầu không vượt giá gói thầu"], "correct": 0, "source": "NĐ 214/2025"}, {"topic": "1. Đấu thầu & Lựa chọn Nhà thầu", "q": "Theo Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), trường hợp giá đề nghị trúng thầu thấp dưới 50% giá gói thầu được duyệt thì chủ đầu tư yêu cầu nhà thầu làm rõ các yếu tố cấu thành chi phí chào thầu, xem xét các bằng chứng liên quan theo hướng nào sau đây?", "options": ["Giải pháp kinh tế được áp dụng hoặc các lợi thế đặc biệt của nhà thầu dẫn đến lợi thế về giá cả Nguồn gốc của hàng hóa, dịch vụ, nhân sự cung cấp cho gói thầu, trong đó phải bảo đảm tuân thủ các quy định của pháp luật Cam kết bằng văn bản của nhà thầu về việc không đề nghị điều chỉnh giá hợp đồng", "Các yếu tố kinh tế liên quan đến biện pháp thi công, quy trình sản xuất hoặc cung cấp dịch vụ Nguồn gốc của hàng hóa, dịch vụ, nhân sự cung cấp o người lao động thi công trên công trường và bảo hiểm trách nhiệm dân sự đối với bên thứ ba", "Chủ đầu tư mua bảo hiểm công trình trong thời gian xây dựng đối với các công trình theo quy định; nhà thầu tư vấn mua bảo hiểm trách nhiệm nghề nghiệp đối với công việc khảo sát, thiết kế xây dựng của công trình từ cấp II trở lên; nhà thầu thi công xây dựng mua bảo hiểm cho người lao động thi công trên công trường và bảo hiểm trách nhiệm dân sự đối với bên thứ ba"], "correct": 3, "source": "Luật XD 135/2025"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Luật Xây dựng số 135/2025/QH15, hợp đồng xây dựng có hiệu lực khi đáp ứng điều kiện nào sau đây?", "options": ["Bên nhận thầu đã thực hiện bảo đảm thực hiện hợp đồng và nhận được tiền tạm ứng từ bên giao thầu", "Các bên đã ký kết hợp đồng, không phụ thuộc vào điều kiện, năng lực của các bên", "Hợp đồng đã được cơ quan quản lý nhà nước về xây dựng phê duyệt", "Đáp ứng đủ các điều kiện theo quy định của pháp luật dân sự về điều kiện có hiệu lực của giao dịch dân sự và các bên phải có đủ điều kiện, năng lực theo quy định của Luật Xây dựng"], "correct": 3, "source": "Luật XD 135/2025"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Luật Xây dựng số 135/2025/QH15, hợp đồng xây dựng được giao kết hợp pháp có hiệu lực từ thời điểm nào?", "options": ["Từ ngày bên giao thầu thực hiện tạm ứng hợp đồng lần đầu cho bên nhận thầu", "Từ ngày chủ đầu tư phê duyệt kết quả lựa chọn nhà thầu", "Từ thời điểm giao kết hoặc thời điểm khác do các bên thỏa thuận; trường hợp hợp đồng xây dựng được công chứng thì thời điểm có hiệu lực thực hiện theo quy định của pháp luật về công chứng", "Từ ngày khởi công xây dựng công trình theo  của chủ đầu tư"], "correct": 2, "source": "Luật XD 135/2025"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Luật Xây dựng số 135/2025/QH15, nhóm nguyên tắc nào sau đây đều thuộc nguyên tắc cơ bản trong hoạt động xây dựng?", "options": ["Tuân thủ quy chuẩn kỹ thuật, tiêu chuẩn áp dụng trong hoạt động  kế xây dựng được phê duyệt", "Do nhà thầu thi công xây dựng tự lựa chọn chủng loại, quy cách, bảo đảm không vượt giá hợp đồng đã ký kết", "Do tư vấn giám sát thi công xây dựng quyết định chủng loại, quy cách, thay thế cho yêu cầu của thiết kế xây dựng"], "correct": 0, "source": "Luật XD 135/2025"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Luật Xây dựng số 135/2025/QH15, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP, việc điều chỉnh đơn giá được áp dụng đối với loại hợp đồng nào?", "options": ["Hợp đồng trọn gói và hợp đồng theo tỷ lệ phần trăm", "Hợp đồng theo đơn giá điều chỉnh, hợp đồng theo thời gian, hợp đồng hỗn hợp và hợp đồng xây dựng khác được phép điều chỉnh đơn giá", "Tất cả các loại hợp đồng xây dựng, không phụ thuộc hình thức giá hợp đồng", "Chỉ áp dụng đối với hợp đồng theo đơn giá điều chỉnh"], "correct": 1, "source": "Luật XD 135/2025"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 206/2026/NĐ-CP, giá bộ phận, đơn vị kết cấu công trình được xác định trên cơ sở nào?", "options": ["Chỉ theo giá do Bộ Xây dựng công bố, không được sử dụng nguồn thông tin khác", "Giá trị quyết toán dự án hoàn thành của chính công trình đó", "Dự toán xây dựng công trình đã được phê duyệt của chính công trình đó", "Báo giá của nhà sản xuất, nhà cung cấp hoặc theo giá được công bố của cơ quan nhà nước có thẩm quyền hoặc giá nhóm công tác xây dựng hoặc theo giá tương tự ở các công trình đã thực hiện hoặc đang thực hiện"], "correct": 3, "source": "NĐ 206/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 206/2026/NĐ-CP, khối lượng tính toán từ thiết kế xây dựng triển khai sau khi dự án được phê duyệt (thiết kế kỹ thuật, thiết kế bản vẽ thi công) được sử dụng để làm gì?", "options": ["Thay thế biên bản nghiệm thu khối lượng hoàn thành khi thanh toán hợp đồng thi công xây dựng", "Xác định sơ bộ tổng mức đầu tư xây dựng trong hồ sơ đề xuất chủ trương đầu tư", "Xác định suất vốn đầu tư xây dựng do cơ quan nhà nước có thẩm quyền công bố", "Làm cơ sở xác định dự toán xây dựng công trình, dự toán gói thầu xây dựng"], "correct": 3, "source": "NĐ 206/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 206/2026/NĐ-CP, việc công bố giá bộ phận, đơn vị kết cấu công trình được quy định như thế nào?", "options": ["Bộ Xây dựng công bố theo định kỳ; Bộ quản lý công trình xây dựng chuyên ngành, Ủy ban nhân dân cấp tỉnh công bố đối với chuyên ngành, địa phương chưa được Bộ Xây dựng công bố hoặc đã được công bố nhưng chưa phù hợp", "Chỉ Bộ Xây dựng có thẩm quyền công bố giá bộ phận, đơn vị kết cấu công trình", "Chủ đầu tư công bố giá bộ phận, đơn vị kết cấu công trình cho từng dự án, công trình", "Ủy ban nhân dân cấp tỉnh công bố theo định kỳ; Bộ Xây dựng chỉ hướng dẫn phương pháp xác định, không thực hiện công bố"], "correct": 0, "source": "NĐ 206/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 207/2026/NĐ-CP, các yêu cầu về chủng loại, nguồn gốc xuất xứ của thiết bị nhập khẩu sử dụng cho thi công xây dựng công trình (nếu có) phải được thể hiện trong hợp đồng với các thông tin chủ yếu nào?", "options": ["Tên chủng loại thiết bị; các thông số kỹ thuật chính; đơn vị nhập khẩu và đại lý phân phối tại Việt Nam", "Tên chủng loại thiết bị; các thông số kỹ thuật chính phù hợp với yêu cầu thiết kế; nhà sản xuất, chế tạo; nơi sản xuất, chế tạo và các chứng từ chứng minh xuất xứ", "Các thông số kỹ thuật chính; giá trị thiết bị; thời hạn bảo hành của nhà sản xuất", "Tên chủng loại thiết bị; giá nhập khẩu; tờ khai hải quan; tỷ giá tại thời điểm nhập khẩu"], "correct": 1, "source": "NĐ 207/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 207/2026/NĐ-CP, thời hạn bảo hành đối với thiết bị công trình, thiết bị công nghệ được xác định như thế nào?", "options": ["Tối thiểu 12 tháng kể từ ngày giao thiết bị tại công trường", "Tối thiểu 24 tháng kể từ ngày ký kết hợp đồng cung cấp thiết bị", "Bằng thời hạn bảo hành của công trình, tính từ ngày nghiệm thu hoàn thành công trình", "Theo hợp đồng xây dựng nhưng không ngắn hơn thời gian bảo hành theo quy định của nhà sản xuất, tính từ khi nghiệm thu hoàn thành công tác lắp đặt, vận hành thiết bị"], "correct": 3, "source": "NĐ 207/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 207/2026/NĐ-CP, vật liệu, sản phẩm, cấu kiện, thiết bị trước khi đưa vào sử dụng cho công trình xây dựng phải đáp ứng yêu cầu nào sau đây?", "options": ["Được nhà thầu thi công xây dựng tự kiểm tra, không bắt buộc lập biên bản nghiệm thu", "Được người giám sát thi công xây dựng của chủ đầu tư nghiệm thu; kết quả nghiệm thu phải được lập thành biên bản", "Được nhà thầu thiết kế xây dựng kiểm tra, xác nhận phù hợp với thiết kế", "Được cơ quan chuyên môn về xây dựng kiểm tra, chấp thuận bằng văn bản"], "correct": 1, "source": "NĐ 207/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 207/2026/NĐ-CP, đối với công trình sử dụng nguồn vốn đầu tư công, vốn chi thường xuyên từ ngân sách nhà nước, vốn ngân sách nhà nước khác, mức tiền bảo hành tối thiểu được quy định như thế nào?", "options": ["5% giá trị hợp đồng đối với công trình xây dựng cấp đặc biệt và cấp I; 10% giá trị hợp đồng đối với công trình xây dựng cấp còn lại", "5% giá trị hợp đồng đối với tất cả các cấp công trình xây dựng", "5% giá trị hợp đồng đối với công trình xây dựng cấp đặc biệt và cấp I; 3% giá trị hợp đồng đối với công trình xây dựng cấp còn lại", "3% giá trị hợp đồng đối với công trình xây dựng cấp đặc biệt và cấp I; 5% giá trị hợp đồng đối với công trình xây dựng cấp còn lại"], "correct": 3, "source": "NĐ 207/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 210/2026/NĐ-CP, bên nhận thầu liên tục không thực hiện công việc theo hợp đồng trong bao nhiêu ngày, làm ảnh hưởng nghiêm trọng đến tiến độ thực hiện hợp đồng, thì bên giao thầu có quyền đơn phương chấm dứt thực hiện hợp đồng (trừ trường hợp các bên có thỏa thuận khác)?", "options": ["45 ngày", "90 ngày", "56 ngày", "28 ngày"], "correct": 2, "source": "NĐ 210/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 210/2026/NĐ-CP, các trường hợp được điều chỉnh thời gian, tiến độ thực hiện hợp đồng xây dựng được xác định như thế nào?", "options": ["Do các bên tham gia hợp đồng thỏa thuận cụ thể trong hợp đồng, kèm theo trách nhiệm của mỗi bên đối với thiệt hại do kéo dài thời gian, tiến độ", "Chỉ được điều chỉnh khi xảy ra sự kiện bất khả kháng", "Do chủ đầu tư quyết định đơn phương trong quá trình thực hiện hợp đồng", "Do tư vấn giám sát quyết định trên cơ sở đề xuất của nhà thầu"], "correct": 0, "source": "NĐ 210/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 210/2026/NĐ-CP, hợp đồng EPC là hợp đồng xây dựng để thực hiện những công việc nào?", "options": ["Thực hiện việc mua sắm, cung cấp vật tư, thiết bị theo đúng thiết kế công nghệ để lắp đặt vào công trình xây dựng và thi công xây dựng công trình", "Thực hiện việc thiết kế và thi công xây dựng công trình", "Thực hiện toàn bộ các công việc: lập Báo cáo nghiên cứu khả thi; thiết kế; mua sắm, cung cấp vật tư, thiết bị; thi công xây dựng công trình; chạy thử, nghiệm thu, bàn giao cho bên giao thầu", "Thực hiện các công việc từ thiết kế, mua sắm, cung cấp vật tư, thiết bị đến thi công xây dựng công trình và chạy thử, nghiệm thu, bàn giao cho bên giao thầu"], "correct": 3, "source": "NĐ 210/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 210/2026/NĐ-CP, hợp đồng chìa khóa trao tay là hợp đồng xây dựng để thực hiện những công việc nào?", "options": ["Thực hiện các công việc từ thiết kế, mua sắm, cung cấp vật tư, thiết bị đến thi công xây dựng công trình và chạy thử, nghiệm thu, bàn giao cho bên giao thầu", "Thực hiện việc thiết kế và mua sắm, cung cấp vật tư, thiết bị theo thiết kế công nghệ", "Thực hiện việc lập Báo cáo nghiên cứu khả thi và thiết kế xây dựng công trình", "Thực hiện toàn bộ các công việc: lập Báo cáo nghiên cứu khả thi; thiết kế; mua sắm, cung cấp vật tư, thiết bị; thi công xây dựng công trình; chạy thử, nghiệm thu, bàn giao cho bên giao thầu"], "correct": 3, "source": "NĐ 210/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 210/2026/NĐ-CP, hợp đồng theo chi phí cộng phí được áp dụng phổ biến đối với trường hợp nào sau đây?", "options": ["Trong quá trình tổ chức lựa chọn nhà thầu, đàm phán, giao kết hợp đồng các bên chưa đủ điều kiện để xác định rõ các yếu tố rủi ro biến động giá đối với chi phí đầu vào để thực hiện hợp đồng", "Trong quá trình tổ chức lựa chọn nhà thầu, đàm phán, giao kết hợp đồng đã đủ điều kiện để xác định rõ về khối lượng và đơn giá hoặc giá, ít có khả năng xảy ra thay đổi về khối lượng, rủi ro biến động giá", "Trong quá trình tổ chức lựa chọn nhà thầu, đàm phán, giao kết hợp đồng đã đủ điều kiện để xác định rõ phạm vi, nội dung công việc nhưng chưa xác định được chính xác số lượng, khối lượng công việc thực tế phải hoàn thành", "Trong quá trình tổ chức lựa chọn nhà thầu, đàm phán, giao kết hợp đồng các bên chưa đủ cơ sở xác định phạm vi công việc, nhu cầu cần thiết về các yếu tố, chi phí đầu vào để thực hiện các công việc dự kiến của hợp đồng"], "correct": 3, "source": "NĐ 210/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 210/2026/NĐ-CP, hợp đồng thi công xây dựng công trình được thanh lý trong trường hợp nào sau đây?", "options": ["Các bên đã hoàn thành các nghĩa vụ theo hợp đồng đã giao kết", "Bên nhận thầu đã hoàn thành toàn bộ công việc thi công nhưng bên giao thầu chưa thanh toán đủ giá trị hợp đồng", "Hợp đồng bị tạm dừng thực hiện do bên giao thầu chậm bàn giao mặt bằng", "Công trình đã được nghiệm thu hoàn thành và đưa vào sử dụng"], "correct": 0, "source": "NĐ 210/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 210/2026/NĐ-CP, hợp đồng xây dựng thuộc dự án đầu tư công bị chấm dứt theo quy định tại khoản 2 Điều 85 Luật Xây dựng thì thời hạn thanh lý hợp đồng được quy định như thế nào?", "options": ["Tối đa 45 ngày kể từ 2026/NĐ-CP, trong quá trình thực hiện hợp đồng, bên nhận thầu có được thay đổi người đại diện quản lý thực hiện hợp đồng không?", "options": ["Không được thay đổi trong suốt thời gian thực hiện hợp đồng", "Được thay đổi, chỉ cần  trực tiếp cho người đại diện của bên giao thầu, không bắt buộc bằng văn bản", "Được thay đổi và phải  cho bên giao thầu biết bằng văn bản; việc thay đổi phải được sự chấp thuận của bên giao thầu nếu các bên có thỏa thuận", "Được thay đổi nhưng trong mọi trường hợp phải được bên giao thầu chấp thuận bằng văn bản"], "correct": 2, "source": "NĐ 210/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 210/2026/NĐ-CP, trường hợp nào sau đây bên giao thầu có quyền đơn phương chấm dứt thực hiện hợp đồng xây dựng?", "options": ["Bên nhận thầu sử dụng nhà thầu phụ đã được nêu trong hợp đồng", "Bên nhận thầu chuyển nhượng hợp đồng xây dựng cho tổ chức khác mà không có sự chấp thuận của bên giao thầu", "Bên nhận thầu đề nghị điều chỉnh tiến độ do mưa lớn kéo dài", "Bên nhận thầu đề xuất thay đổi biện pháp thi công"], "correct": 1, "source": "NĐ 210/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 210/2026/NĐ-CP, trường hợp thiết bị công nghệ do bên nhận thầu cung cấp bị khiếu nại vi phạm quyền sở hữu trí tuệ, nhưng vi phạm phát sinh từ thiết kế, dữ liệu do bên giao thầu cung cấp, thì trách nhiệm của bên nhận thầu được xác định như thế nào?", "options": ["Bên nhận thầu và bên giao thầu chia đều trách nhiệm đối với tranh chấp", "Nhà sản xuất thiết bị chịu trách nhiệm; các bên không có nghĩa vụ  cho nhau về khiếu nại", "Bên nhận thầu chịu toàn bộ trách nhiệm đối với tranh chấp trong mọi trường hợp", "Bên nhận thầu không phải chịu trách nhiệm đối với tranh chấp phát sinh trong trường hợp này"], "correct": 3, "source": "NĐ 210/2026"}, {"topic": "2. Hợp đồng & Quản lý Dự án", "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng EPC, EP, EC, trường hợp các bên thỏa thuận bên nhận thầu lập yêu cầu về thông số kỹ thuật, c const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let entries=[],answers={};const topic=document.getElementById('topic'),main=document.getElementById('questions');
const topics=[...new Set(DATA.map(x=>x.topic))];topic.innerHTML='<option value="">Tất cả chuyên đề ('+DATA.length+' câu)</option>';topics.forEach(t=>{let o=document.createElement('option');o.value=t;o.textContent=t+' ('+DATA.filter(x=>x.topic===t).length+' câu)';topic.append(o)});
function prepare(){answers={};entries=shuffle(DATA.map((x,id)=>({ ...x,id,opts:shuffle(x.options.map((label,index)=>({label,index}))) })));render()}
function visible(){return entries.filter(x=>!topic.value||x.topic===topic.value)}
function update(){let shown=visible(),done=shown.filter(x=>answers[x.id]!==undefined),right=done.filter(x=>answers[x.id]===x.correct).length;document.getElementById('done').textContent=done.length+'/'+shown.length;document.getElementById('right').textContent=right;document.getElementById('rate').textContent=done.length?Math.round(right/done.length*100)+'%':'0%';document.getElementById('progress').style.width=(shown.length?done.length/shown.length*100:0)+'%'}
function render(){main.replaceChildren();visible().forEach((x,i)=>{let card=document.createElement('section');card.className='card';let meta=document.createElement('div');meta.className='meta';meta.textContent='Câu '+(i+1)+' / '+visible().length+' · '+x.topic+(x.source?' · '+x.source:'');card.append(meta);let q=document.createElement('div');q.className='question';q.textContent=x.q;card.append(q);let selected=answers[x.id];x.opts.forEach((op,j)=>{let label=document.createElement('label');label.className='option'+(selected!==undefined?' locked'+(op.index===x.correct?' correct':op.index===selected?' wrong':''):'');let input=document.createElement('input');input.type='radio';input.name='q'+x.id;input.checked=selected===op.index;input.disabled=selected!==undefined;input.addEventListener('change',()=>{answers[x.id]=op.index;render();});let span=document.createElement('span');span.textContent='ABCD'[j]+'. '+op.label;label.append(input,span);card.append(label)});if(selected!==undefined){let f=document.createElement('div');f.className='feedback '+(selected===x.correct?'good':'bad');f.textContent=selected===x.correct?'✓ Chính xác!':x.correct>=0?'✗ Chưa đúng. Đáp án đúng được tô xanh.':'⚠ Chưa có đáp án hợp lệ trong file nguồn.';card.append(f)}main.append(card)});if(!visible().length)main.innerHTML='<div class="empty">Không có câu hỏi.</div>';update()}
topic.addEventListener('change',render);document.getElementById('reset').addEventListener('click',()=>{if(Object.keys(answers).length&&!confirm('Xóa kết quả hiện tại và đảo lại đề?'))return;prepare();window.scrollTo(0,0)});prepare();
